<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">  
 <link rel="stylesheet" href="{{ url_for('static', filename='css/details.css') }}">
</head>
<ul>
  <li><a href="{{url_for('home')}}">Home</a></li>
  <li><a href="{{url_for('details')}}">Details</a></li>
  <li><a href="{{url_for('accounts')}}">Accounts</a></li>
  <li><a href="{{url_for('loans')}}">Loans</a></li>
  <spam><form action="{{ url_for('accounts') }}" method="POST"><!-- This form takes the search input and sends it to the server for validation. -->
    <input type="text" placeholder="Search.." name="search">
    <button type="submit"><i class="fa fa-search"></i></button>
  </form></spam>
</ul>
<div class="top-banner"><!-- This is the top banner of the accounts page. -->
<h1>These are all of the accounts.</h1>
<h2>To find out more about an account click on the name.</h2>
</div>
<table border="0"><!-- This table displays all of the accounts. -->
       <thead>
           <tr>
               <th>ID</th>
               <th>Account Name</th>
           </tr>
       </thead>
{% for account in accounts %}
 <tr>
   <td>{{ account[0] }}</td>
   <td>
   <a href="{{ url_for('account_info', account_id=account[0], customer_id='0', customer = 'invalid')}}">
     {{ account[1] }}
   </a>
   </td>
 </tr>
 {%endfor%}
</table>
</html>

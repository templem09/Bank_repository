<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">
</head>
<div class="top-banner">
    <h1>This is the information about {{ customer[0][1] }}</h1>
    <a href="{{url_for('home')}}">
    <button class="top-corner-btn">Home</button>
    </a>
</div>
<body>
   {% for item in customer %}
        <p>ID: {{ item[0] }}</p>
        <p>Name: {{ item[1] }}</p>
        <p>Birthday: {{ item[2] }}</p>
        <p>Email: {{ item[3] }}</p>
        <p>Phone Number: {{ item[4] }}</p>
        <p>ID Photo:</p>
        <img src="../static/images/{{ item[0] }}.png" alt="ID Photo">
   {% endfor %}
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> <link rel="stylesheet" href="{{ url_for('static', filename='css/details.css') }}">
</head>

<div class="top-banner"><!-- This is the top banner of the details page. -->
  <h1>These are all of the customers.</h1>
  <h2>To find out more about a customer click on their name.</h2>
  <a href="{{url_for('home')}}">
  <button class="top-corner-btn">Home</button>
  </a>
  <a href="{{url_for('details')}}">
  <div><button type="button">Details</button></div>
  </a>
  <a href="{{url_for('accounts')}}">
  <div><button type="button">Accounts</button></div>
  </a>
  <a href="{{url_for('loans')}}">
  <div><button type="button">Loans</button></div>
  </a>
  <form action="{{ url_for('details') }}" method="POST"><!-- This form takes the search input and sends it to the server for validation. -->
      <input type="text" placeholder="Search.." name="search">
      <button type="submit"><i class="fa fa-search"></i></button>
    </form>
</div>
<table border="0"><!-- This table displays all of the customers. -->
        <thead>
            <tr>
                <th>ID</th>
                <th>Customer Name</th>
                <th>Birthday</th>
            </tr>
        </thead>
{% for customer in customers %}
  <tr>
    <td>{{ customer[0] }}</td>
    <td>
    <a href="{{ url_for('customer', customer_id=customer[0], bridge_id=0, bridge_table = 'N_A')}}">
      {{ customer[1] }}
    </a>
    </td>
    <td>{{ customer[2] }}</td>
  </tr>
  {%endfor%}
</table>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>


<form method="POST"><!-- This form takes the employee name and password and sends it to the server for validation. -->
   <label for="username">Employee Name:</label>
   <input type="text" id="username" name="employee_name" required>
   <br>
   <label for="password">Password:</label>
   <input type="text" id="password" name="password" required>
   <br>
   <button type="submit">Submit</button>
</form>
<body>
   {%if invalid == 'Username or password incorrect.'%}<!-- This is the case where the username or password is incorrect. -->
       <p>{{invalid}}</p>
   {%endif%}
</body>
